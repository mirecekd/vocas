<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOCAS 2.0 - Přihlášení</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root { --bg-color: #121212; --accent-color: #ff9800; --field-bg: #2c2c2c; }
        body {
            background-color: var(--bg-color); color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        form { width: 90%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.4rem; color: var(--accent-color); display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .logo { width: 64px; height: 64px; }
        input {
            width: 100%; box-sizing: border-box; padding: 1.2rem; margin-bottom: 1rem;
            font-size: 1.2rem; border: none; border-radius: 30px;
            background-color: var(--field-bg); color: #fff; outline: none;
        }
        button {
            width: 100%; padding: 1.2rem; font-size: 1.2rem; border: none; border-radius: 30px;
            background-color: var(--accent-color); color: #000; font-weight: bold; cursor: pointer;
        }
        .error { color: #ff5252; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <form method="post" action="/login">
        <h1><img src="/static/favicon.svg" class="logo" alt="VOCAS Logo"><span>VOCAS</span></h1>
        {% if error %}<div class="error">Nesprávné jméno nebo heslo</div>{% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="text" name="username" placeholder="Jméno" autocomplete="username" autocapitalize="none" autofocus required>
        <input type="password" name="password" placeholder="Heslo" autocomplete="current-password" required>
        <button type="submit">PŘIHLÁSIT</button>
    </form>
</body>
</html>
